name: control job

on:
  push:
    branches:
      - main


jobs:

  concurrency-job2:
    name: test the concurrency-job2 feature
    runs-on: ubuntu-latest
    concurrency: 
      group: test
      cancel-in-progress: true
    steps:
      - run: echo "In concurrecny Job2"
      
  concurrency-job1:
    name: test the concurrency-job1 feature
    runs-on: ubuntu-latest
    concurrency: 
      group: test
      cancel-in-progress: true
    steps:
      - run: echo "In concurrecny Job1"








  deploy-job:
    name: deploy job
    runs-on: ubuntu-latest
    needs: build-job
    steps:
      - name: test needs fucntion
        run: echo ${{needs.build-job.outputs.build-output}}













  build-job:
    name: building job
    outputs:
      build-output: ${{steps.aStepId.outputs.buildout}}
    runs-on: ubuntu-latest
    container:
      image: python:3.12
    steps:
      - name: print py version
        id: aStepId
        run: |
          pyvar=$(python --version)
          echo "buildout=$pyvar" >> "$GITHUB_OUTPUT"
  
